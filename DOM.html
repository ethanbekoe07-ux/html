<!DOCTYPE>
<html>
    <body>
        <title>My zoo</title>
        <style>

            body{
                font-family: Arial, Helvetica, sans-serif;
                background: aliceblue;
                text-align: center;
                padding: 30px;
            }

            h1 {
                color: #ff5a43;
            }
             
            #zoo {
                border: 2px,solid#ff5a43;
                width:300px;
                margin: 16px auto;
                padding:8px,12px;
                border-radius:10px;
                background:white;

                .zone{
                    border: 1px, solid #ff5a43;
                    margin: 6px 0;
                    padding: 8px, 12px;
                    border-radius: 6px;
                    text-align: left;
                }

                button {
                    background:#ff5a43;
                    color:white
                    padding:10px,24px;
                    border:none;
                    border-radius:20px;
                    text-align:left;
                    cursor:pointer;
                }

        </style>
    </body>

    <h1>My zoo</h1>
    <p>Use JavaScript and  the DOM to add animals to each cage.</p>

    <!--
        DOM tree: zoo is the parent element node.
        Zone divs are child element nodes.Animal names inside each span are text nodes.
        -->
        <div id="zoo">
            <div class="zone"
             </div>
