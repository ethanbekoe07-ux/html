<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Superhero Card</title>
    <style>
        /* Typography - font, size, weight, colour for the whole page */
        body {
        background-color: darkblue;
         color: white;
         font-family:arial, sans serif
    }

    /* Typography + Text shadow - big bold title with an orange shadow */
    .hero-name {
        font-size: 16px;
        font-weight: bold;
        color: yellow;
        text-shadow: 3px 3px orange;
    }

    /* Typograhy + Text transform - tagline becomes Title case */
    .tagline {
        font-style: italic;
        color: lightblue;
        text-transform: capitalize;
    }

    /* Text tranaform + Text decoration - section headings in CAPS with underline */
    .label {
        text-transform: uppercase;
        text-decoration: underline;
        color: coral;
    }

    /* Typography - powers stand out in bold green */
    .power {
        font-weight: bold;
        color: lightgreen;
    }

    /* Text decoration - weaknesses are crossed out */
    .weakness {
        text-decoration: line-through;
        color: gray;
    }

    /* Trandform -  the badge is titled to the sides */
    .badge {
        font-size: 28px;
        font-weight: bold;
        color: gold;
        transform: rotate(15deg);
    </style>
</head>
<body>
    
</body>
</html>
