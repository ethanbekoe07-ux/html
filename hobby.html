    <title>My Hobby Hub</title>

</head>
<body>

    <!--container-fluid: strecthes to fill the full width of the screen-->

    <!-- container: keeps content centred and neat on the page -->
     <div class="container">

        <h2>Reading</h2>
        <p>I love reading adventure stories and discovering new facts everyday.</p>
     </div>

        <!--bg-success: green background,white text -->
        <div class="bg-success: text-white p-3 my-3">

            </div>

         <h2>Drawing</h2>
           <p>I enjoy drawing animals and making my own comic strips.</p>
        </div>

        <!--bg-info:teal background with a dark border -->

        </div>
